<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Cafe Stream Overlay - Final Ver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 1920px; height: 1080px; background-color: transparent; overflow: hidden; font-family: 'M PLUS Rounded 1c', sans-serif; }
        
        /* 全体コンテナ */
        .overlay-container { position: relative; width: 100%; height: 100%; }

        /* --- ゲーム画面フレーム --- */
        .game-frame-deco {
            position: absolute; top: 15px; left: 15px; right: 15px; bottom: 190px; /* 下部バーとの隙間を確保 */
            border: 10px solid #d4af37; /* 金枠のみシンプルに */
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 1; pointer-events: none;
        }

        /* --- 右上の絵馬風飾り --- */
        .top-deco-ema {
            position: absolute; top: 35px; right: 35px;
            background: linear-gradient(to bottom, #fff, #f0e68c);
            border: 4px solid #d4af37;
            clip-path: polygon(50% 0%, 100% 25%, 100% 100%, 0% 100%, 0% 25%);
            padding: 35px 25px 15px 25px; text-align: center; transform: rotate(5deg);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3); z-index: 5;
        }
        .ema-text-main { font-family: 'Yuji Syuku', serif; font-size: 28px; color: #b71c1c; margin-bottom: 5px; }
        .ema-text-sub { font-size: 16px; color: #333; font-weight: 700; }
        .top-deco-ema::before {
            content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 30px; background: #b71c1c; border-radius: 4px; z-index: -1;
        }

        /* --- 下部バー (高さ調整) --- */
        .bottom-bar {
            position: absolute; bottom: 20px; left: 20px; right: 20px; height: 160px;
            background: linear-gradient(90deg, #b71c1c 0%, #ff4e50 30%, #f9d423 100%);
            border-radius: 20px; display: flex; align-items: center; padding: 0 40px;
            border: 5px solid #fff;
            box-shadow: 0 0 0 5px #d4af37, 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
            overflow: visible; /* キャラを少しはみ出させるためvisible */
        }
        
        /* 背景パターン */
        .pattern-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15;
            background-image: repeating-linear-gradient(45deg, #fff 0px, #fff 2px, transparent 2px, transparent 10px);
            z-index: 0; pointer-events: none; border-radius: 15px;
        }

        /* --- 情報エリア（左側） --- */
        .info-area {
            position: relative; z-index: 2; flex-grow: 1;
            display: flex; flex-direction: column; justify-content: center;
        }

        /* 配信タイトル（小さめに上に乗せる） */
        .stream-sub-title {
            color: #fff; font-size: 24px; font-weight: 700;
            display: flex; align-items: center; gap: 10px; margin-bottom: 5px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }
        .badge { background: #fff; color: #b71c1c; padding: 2px 10px; border-radius: 4px; font-size: 18px; }

        /* ゲームタイトル（超巨大化） */
        .game-title-main {
            font-size: 60px; /* サイズ大幅アップ */
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
            text-shadow: 4px 4px 0 #b71c1c, -2px -2px 0 #d4af37; /* 強めの縁取り */
            white-space: nowrap;
        }

        /* --- 右側のエリア（SNS + キャラ） --- */
        .right-area {
            position: relative; z-index: 10;
            display: flex; align-items: center; gap: 40px;
            height: 100%;
        }

        /* SNSローテーション表示 */
        .social-box {
            background: rgba(0,0,0,0.8); border: 2px solid #fff; color: #fff;
            padding: 8px 25px; border-radius: 50px;
            font-size: 22px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
            min-width: 320px; justify-content: center;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        }
        .social-text { transition: opacity 0.5s ease, transform 0.5s ease; white-space: nowrap; }
        .fade-out { opacity: 0; transform: translateY(10px); }
        .fade-in { opacity: 1; transform: translateY(0); }

        /* --- キャラクター調整 --- */
        .characters-area {
            display: flex; gap: -20px; align-items: flex-end;
            /* 重要: バーの中に収まるよう位置調整 */
            position: relative;
            bottom: -10px; /* 下部バーの底辺に合わせる */
        }

        .char-img {
            width: 170px; /* 少しサイズ調整 */
            height: auto;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.2));
            /* 下からひょっこり感を出すため、transform-originを下部に */
            transform-origin: bottom center;
        }
        
        /* ぴょこぴょこアニメーション（控えめに） */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .char-img:nth-child(1) { animation: bounce-gentle 3s infinite ease-in-out; z-index: 3; }
        .char-img:nth-child(2) { animation: bounce-gentle 3.2s infinite ease-in-out 0.5s; z-index: 2; }
        .char-img:nth-child(3) { animation: bounce-gentle 2.8s infinite ease-in-out 1s; z-index: 1; }

    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="game-frame-deco"></div>

        <div class="top-deco-ema">
            <div class="ema-text-main">開運</div>
            <div class="ema-text-sub">年末SP</div>
        </div>

        <div class="bottom-bar">
            <div class="pattern-bg"></div>
            
            <div class="info-area">
                <div class="stream-sub-title">
                    <span class="badge">LIVE</span>
                    ふらっとcafe 年末大掃除SP
                </div>
                <div class="game-title-main">
                    PowerWash Simulator 2
                </div>
            </div>

            <div class="right-area">
                <div class="social-box">
                    <span>𝕏</span>
                    <span id="social-display" class="social-text">@flca_official</span>
                </div>

                <div class="characters-area">
                    <img src="./cat_hat.png" alt="Character 1" class="char-img">
                    <img src="./black_hair.png" alt="Character 2" class="char-img">
                    <img src="./white_glasses.png" alt="Character 3" class="char-img">
                </div>
            </div>
        </div>
    </div>

    <script>
        const accounts = [
            { label: "公式", id: "@flca_official" },
            { label: "若凪", id: "@wakanagi_flca" }
        ];
        let currentIndex = 0;
        const displayElement = document.getElementById('social-display');

        setInterval(() => {
            displayElement.classList.remove('fade-in');
            displayElement.classList.add('fade-out');
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % accounts.length;
                const nextAccount = accounts[currentIndex];
                displayElement.textContent = `${nextAccount.label}: ${nextAccount.id}`;
                displayElement.classList.remove('fade-out');
                displayElement.classList.add('fade-in');
            }, 500);
        }, 5000);
    </script>
</body>
</html>
