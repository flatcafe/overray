<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Cafe Stream Overlay - End of Year</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            background-color: transparent; /* OBS等で取り込む際は背景透過になります */
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        /* 全体のコンテナ */
        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* 配信ソフトでクロマキー設定をする場合用（通常はbody透過でOK） */
            /* background-color: #0f0; */ 
        }

        /* ゲーム画面エリア（領域確保のみ・何も表示しない） 
           OBSでこの枠に合わせてゲームキャプチャを配置してください */
        .game-area-placeholder {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 1880px; /* ほぼ全画面 */
            height: 880px; /* 下部にスペースを残す */
            border: 4px dashed rgba(255, 255, 255, 0.3); /* 配置目安用の枠線（本番は消してもOK） */
            border-radius: 15px;
            z-index: 0;
        }

        /* 下部の情報バー（ベース） */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 160px;
            background: linear-gradient(95deg, #ff4e50, #f9d423); /* ポップな赤金のグラデーション */
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1;
            border: 4px solid #fff;
        }

        /* 和柄（市松模様）のアクセント背景 */
        .pattern-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(255,255,255,0.15) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.15) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.15) 75%);
            background-size: 20px 20px;
            border-radius: 16px;
            z-index: 0;
        }

        /* テキスト情報エリア */
        .info-area {
            position: relative;
            z-index: 2;
            color: #fff;
            text-shadow: 2px 2px 0px #d63031;
            flex-grow: 1;
        }

        .stream-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-title {
            font-size: 24px;
            font-weight: 700;
            background-color: #fff;
            color: #d63031;
            padding: 2px 15px;
            border-radius: 50px;
            display: inline-block;
            text-shadow: none;
        }

        .badge-year {
            background-color: #d63031;
            border: 2px solid #fff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 16px;
            transform: rotate(-5deg);
            display: inline-block;
            margin-right: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* キャラクターエリア */
        .characters-area {
            position: relative;
            z-index: 10;
            display: flex;
            gap: -20px; /* キャラを少し重ねる */
            align-items: flex-end;
            margin-right: -20px; /* 右端に寄せる */
            bottom: 30px; /* バーより少し上に飛び出させる */
        }

        .char-img {
            width: 180px; /* キャラのサイズ */
            height: auto;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        /* ぴょこぴょこ動くアニメーション */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .char-img:nth-child(1) { animation: bounce 3s infinite ease-in-out; animation-delay: 0s; z-index: 3; }
        .char-img:nth-child(2) { animation: bounce 3.2s infinite ease-in-out; animation-delay: 0.5s; z-index: 2; }
        .char-img:nth-child(3) { animation: bounce 2.8s infinite ease-in-out; animation-delay: 1s; z-index: 1; }

        /* 装飾：右上の年末バッジ */
        .top-deco {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #fff;
            border: 4px solid #ff4e50;
            color: #ff4e50;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            transform: rotate(3deg);
            z-index: 5;
        }

    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="game-area-placeholder"></div>

        <div class="top-deco">
            年末スペシャル！🎍
        </div>

        <div class="bottom-bar">
            <div class="pattern-bg"></div>
            
            <div class="info-area">
                <div class="stream-title">
                    <span class="badge-year">2025-2026</span>
                    ふらっとcafe 年末大掃除SP
                </div>
                <div class="game-title">
                    PowerWash Simulator 2
                </div>
            </div>

            <div class="characters-area">
                <img src="./cat_hat.png" alt="Character 1" class="char-img">
                
                <img src="./black_hair.png" alt="Character 2" class="char-img">

                <img src="./white_glasses.png" alt="Character 3" class="char-img">
            </div>
        </div>
    </div>

</body>
</html>
